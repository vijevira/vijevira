<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <radialGradient id="glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur-lg">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Ambient glow left node -->
  <ellipse cx="215" cy="225" rx="110" ry="110" fill="url(#glow-l)" filter="url(#blur-lg)"/>
  <!-- Ambient glow right node -->
  <ellipse cx="585" cy="225" rx="110" ry="110" fill="url(#glow-r)" filter="url(#blur-lg)"/>

  <!-- Connection line dashes -->
  <line x1="270" y1="225" x2="530" y2="225" stroke="#22d3ee" stroke-width="2" stroke-dasharray="8 6" opacity="0.5"/>

  <!-- Lock icon in center -->
  <g transform="translate(375, 200)">
    <rect x="0" y="18" width="50" height="36" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5" opacity="0.9"/>
    <path d="M10 18 v-8 a15 15 0 0 1 30 0 v8" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
    <circle cx="25" cy="36" r="5" fill="#22d3ee" opacity="0.9"/>
    <rect x="22.5" y="36" width="5" height="8" rx="2" fill="#22d3ee" opacity="0.9"/>
    <!-- DTLS label -->
    <text x="25" y="74" text-anchor="middle" font-family="monospace" font-size="9" fill="#22d3ee" opacity="0.6" letter-spacing="1">DTLS</text>
  </g>

  <!-- Left node: Sender -->
  <g transform="translate(140, 155)">
    <!-- Node circle -->
    <circle cx="75" cy="70" r="52" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <!-- Upload arrow icon -->
    <g transform="translate(55, 47)">
      <polyline points="20,22 20,6 8,18" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="20,6 32,18" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="8" y="24" width="24" height="3" rx="1.5" fill="#22d3ee" opacity="0.4"/>
    </g>
    <text x="75" y="140" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.5">Sender</text>
  </g>

  <!-- Right node: Receiver -->
  <g transform="translate(510, 155)">
    <!-- Node circle -->
    <circle cx="75" cy="70" r="52" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <!-- Download arrow icon -->
    <g transform="translate(55, 47)">
      <polyline points="20,6 20,22 8,10" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="20,22 32,10" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="8" y="24" width="24" height="3" rx="1.5" fill="#818cf8" opacity="0.4"/>
    </g>
    <text x="75" y="140" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.5">Receiver</text>
  </g>

  <!-- Tool pills row -->
  <g transform="translate(50, 345)">
    <!-- BlindDrop -->
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#0f172a" stroke="#22d3ee" stroke-width="1" opacity="0.8"/>
    <text x="50" y="17.5" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#22d3ee">BlindDrop</text>
    <!-- BlindText -->
    <rect x="110" y="0" width="100" height="26" rx="13" fill="#0f172a" stroke="#22d3ee" stroke-width="1" opacity="0.8"/>
    <text x="160" y="17.5" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#22d3ee">BlindText</text>
    <!-- BlindSnippet -->
    <rect x="220" y="0" width="110" height="26" rx="13" fill="#0f172a" stroke="#22d3ee" stroke-width="1" opacity="0.8"/>
    <text x="275" y="17.5" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#22d3ee">BlindSnippet</text>
    <!-- BlindSecret -->
    <rect x="340" y="0" width="108" height="26" rx="13" fill="#0f172a" stroke="#818cf8" stroke-width="1" opacity="0.8"/>
    <text x="394" y="17.5" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#818cf8">BlindSecret</text>
    <!-- BlindShow -->
    <rect x="458" y="0" width="100" height="26" rx="13" fill="#0f172a" stroke="#818cf8" stroke-width="1" opacity="0.8"/>
    <text x="508" y="17.5" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#818cf8">BlindShow</text>
    <!-- BlindCast -->
    <rect x="568" y="0" width="100" height="26" rx="13" fill="#0f172a" stroke="#818cf8" stroke-width="1" opacity="0.8"/>
    <text x="618" y="17.5" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#818cf8">BlindCast</text>
  </g>

  <!-- Title -->
  <text x="400" y="52" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#f1f5f9" letter-spacing="-0.5">BlindShare</text>
  <text x="400" y="78" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#64748b" letter-spacing="1">P2P · ZERO-PERSISTENCE · DTLS ENCRYPTED</text>

  <!-- Corner label -->
  <text x="750" y="430" text-anchor="end" font-family="monospace" font-size="11" fill="#334155">blindshare.in</text>
</svg>
