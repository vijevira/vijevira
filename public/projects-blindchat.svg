  </g>
  <text x="400" y="372" text-anchor="middle" font-family="'Segoe UI', system-ui" font-size="30" font-weight="700" fill="#ecfdf5">BlindChat</text>
  <text x="400" y="400" text-anchor="middle" font-family="'Segoe UI', system-ui" font-size="13" fill="#94a3b8">End-to-end encrypted chat · P2P calls · Web &amp; Android</text>
