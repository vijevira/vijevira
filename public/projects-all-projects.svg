<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050a24"/>
      <stop offset="100%" style="stop-color:#12208f"/>
    </linearGradient>
    <linearGradient id="tile1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2337ff"/>
      <stop offset="100%" style="stop-color:#000d8a"/>
    </linearGradient>
    <linearGradient id="tile2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5b6cff"/>
      <stop offset="100%" style="stop-color:#2337ff"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Subtle grid texture -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M40 0 V300 M120 0 V300 M200 0 V300 M280 0 V300 M360 0 V300"/>
    <path d="M0 40 H400 M0 100 H400 M0 160 H400 M0 220 H400"/>
  </g>

  <!-- Bento grid of tiles: payments, games, backend, AI, cloud, security -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="112" height="84" rx="14" fill="url(#tile1)"/>
    <rect x="144" y="20" width="112" height="84" rx="14" fill="url(#tile2)"/>
    <rect x="268" y="20" width="112" height="84" rx="14" fill="url(#tile1)"/>
    <rect x="20" y="116" width="112" height="84" rx="14" fill="url(#tile2)"/>
    <rect x="144" y="116" width="112" height="84" rx="14" fill="url(#tile1)"/>
    <rect x="268" y="116" width="112" height="84" rx="14" fill="url(#tile2)"/>
  </g>

  <text x="76" y="70" text-anchor="middle" font-size="30">💳</text>
  <text x="200" y="70" text-anchor="middle" font-size="30">🎮</text>
  <text x="324" y="70" text-anchor="middle" font-size="30">⚙️</text>
  <text x="76" y="166" text-anchor="middle" font-size="30">🤖</text>
  <text x="200" y="166" text-anchor="middle" font-size="30">☁️</text>
  <text x="324" y="166" text-anchor="middle" font-size="30">🔐</text>

  <!-- Title -->
  <text x="200" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="2">ALL PROJECTS</text>
  <text x="200" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a3b0ff" letter-spacing="3">PORTFOLIO OVERVIEW</text>
</svg>
