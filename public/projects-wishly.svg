<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2a1530"/>
      <stop offset="100%" stop-color="#120914"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="400" cy="200" rx="220" ry="150" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Confetti -->
  <g opacity="0.8">
    <rect x="250" y="90" width="8" height="14" rx="2" fill="#fbbf24" transform="rotate(25 254 97)"/>
    <rect x="540" y="100" width="8" height="14" rx="2" fill="#60a5fa" transform="rotate(-30 544 107)"/>
    <rect x="300" y="60" width="6" height="12" rx="2" fill="#34d399" transform="rotate(60 303 66)"/>
    <rect x="490" y="70" width="6" height="12" rx="2" fill="#f472b6" transform="rotate(-50 493 76)"/>
    <circle cx="220" cy="160" r="4" fill="#a78bfa"/><circle cx="585" cy="165" r="4" fill="#fbbf24"/>
    <circle cx="410" cy="62" r="3.5" fill="#60a5fa"/><circle cx="350" cy="96" r="3" fill="#f472b6"/>
  </g>
  <!-- Envelope -->
  <g transform="translate(290, 120)">
    <rect width="220" height="140" rx="10" fill="#3b1d40" stroke="#f9a8d4" stroke-width="1.5"/>
    <path d="M0 10 L110 84 L220 10" fill="none" stroke="#f9a8d4" stroke-width="1.5"/>
    <circle cx="110" cy="84" r="20" fill="#be185d"/>
    <path d="M110 94 l-9 -9 a5.5 5.5 0 0 1 9 -6 a5.5 5.5 0 0 1 9 6 z" fill="#fce7f3"/>
  </g>
  <!-- Channel dots -->
  <g font-family="'Segoe UI', system-ui" font-size="11" fill="#cbd5e1" text-anchor="middle">
    <circle cx="250" cy="300" r="7" fill="#22c55e"/><text x="250" y="322">WhatsApp</text>
    <circle cx="325" cy="300" r="7" fill="#f59e0b"/><text x="325" y="322">Email</text>
    <circle cx="400" cy="300" r="7" fill="#38bdf8"/><text x="400" y="322">Telegram</text>
    <circle cx="475" cy="300" r="7" fill="#818cf8"/><text x="475" y="322">Discord</text>
    <circle cx="550" cy="300" r="7" fill="#e879f9"/><text x="550" y="322">Slack</text>
  </g>
  <text x="400" y="372" text-anchor="middle" font-family="'Segoe UI', system-ui" font-size="30" font-weight="700" fill="#fdf2f8">Wishly</text>
  <text x="400" y="400" text-anchor="middle" font-family="'Segoe UI', system-ui" font-size="13" fill="#94a3b8">Automated wishes from your own channels</text>
</svg>
